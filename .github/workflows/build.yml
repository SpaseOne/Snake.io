name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Buildozer in Docker
        run: |
          docker run --rm -v "${{ github.workspace }}":/home/user/hostcwd kivy/buildozer:latest android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: bin/*.apk
