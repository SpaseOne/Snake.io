name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade docker-ce docker-ce-cli containerd.io

      - name: Build with Buildozer in Docker
        run: |
          docker pull kivy/buildozer:stable
          docker run --rm -v "${{ github.workspace }}":/home/user/hostcwd kivy/buildozer:stable android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-apk
          path: bin/*.apk
